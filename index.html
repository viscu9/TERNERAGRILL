<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERNERA GRILL - Carta</title>
<style>
html,body{margin:0;padding:0;background:#eee2cf}
img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div id="carta"></div>
<script src="config.js"></script>
<script>
const carpeta = CARTA_ACTIVA === "verano" ? "verano" : "normal";
const carta = document.getElementById("carta");
[1,2].forEach(n=>{
  const img=document.createElement("img");
  img.src=carpeta+"/pagina"+n+".jpg";
  img.alt="Carta TERNERA GRILL";
  carta.appendChild(img);
});
</script>
</body>
</html>
